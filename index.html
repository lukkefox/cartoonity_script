<style>
:root{--bg:#0d0f1e;--side:#12152b;--panel:#171a36;--line:#2a2e57;--tx:#e9ebff;--mut:#8d92bd;--ac:#6b5cff;--ac2:#3a3aff;--hov:#1f2347}
[data-theme=light]{--bg:#f2f1fb;--side:#fff;--panel:#fff;--line:#dcdaf0;--tx:#1c1e33;--mut:#6b6e95;--hov:#ecebfa}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:232px 1fr;height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 18px;font-size:18px;font-weight:600}
.brand img{width:40px;height:40px}.brand:not(.cust) .bt{display:none!important}.brand.cust img{object-fit:contain}.topr .brand:not(.cust) img,.brand:not(.cust) img{width:auto;height:auto;max-width:168px;max-height:60px;object-fit:contain}
.nv{background:none;border:0;text-align:left;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--mut)}
.nv:hover{background:var(--hov)}
.nv.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.sp{flex:1}
.fd{font-size:12.5px;color:var(--mut);padding:8px 10px;border-top:1px solid var(--line);word-break:break-word}
.fd.err{color:#ff7b8a}
main{overflow:hidden;min-width:0}
.wrap{display:grid;grid-template-columns:268px 1fr;height:100%}
.lst{border-right:1px solid var(--line);padding:14px;overflow:auto}
.pane{overflow:auto;padding:20px 28px 60px}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:var(--panel);color:var(--tx);border:1px solid var(--line)}
.lst .btn{width:100%;margin-bottom:12px}
.it{display:flex;justify-content:space-between;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer}
.it:hover{background:var(--hov)}.it.on{background:var(--hov);outline:1px solid var(--ac)}

(function(){let L=null,pool=[],raf=0,hid=new Set();

  const vw=innerWidth,vh=innerHeight,use=new Set();let n=0;
  document.querySelectorAll('#hm-g').forEach(el=>{
   if(!el.placeholder||el.value||el===document.activeElement||el.disabled||el.readOnly)return;
   if(/^(checkbox|radio|color|range|file|hidden|button|submit|number|date|time)$/.test(el.type))return;
   const r=el.getBoundingClientRect();if(r.width<20||r.height<14||r.bottom<0||r.top>vh||r.right<0||r.left>vw)return;
   const cs=getComputedStyle(el);if(cs.visibility!='visible'||cs.display=='none'||+cs.opacity<.05)return;
   const hx=el.hasAttribute('data-phx');if(hx)el.removeAttribute('data-phx');const pc=getComputedStyle(el,'::placeholder'),pcol=pc.color,pop=+pc.opacity;if(hx)el.setAttribute('data-phx','');if(pop<.05)return;
   const hit=document.elementFromPoint(Math.min(vw-1,Math.max(0,r.left+Math.min(12,r.width/2))),Math.min(vh-1,Math.max(0,r.top+r.height/2)));if(hit!==el)return;
   let sp=pool[n];if(!sp){sp=document.createElement('span');pool[n]=sp;layer().appendChild(sp)}n++;
   const f=x=>parseFloat(x)||0,bl=f(cs.borderLeftWidth),bt=f(cs.borderTopWidth),pl=f(cs.paddingLeft),pr=f(cs.paddingRight),pt=f(cs.paddingTop),pb=f(cs.paddingBottom),br=f(cs.borderRightWidth),bb=f(cs.borderBottomWidth);
   const w=r.width-bl-br-pl-pr,h=r.height-bt-bb-pt-pb,ta=el.tagName=='TEXTAREA';
   if(sp.textContent!==el.placeholder)sp.textContent=el.placeholder;
   const st=sp.style;st.display='block';st.left=(r.left+bl+pl)+'px';st.top=(r.top+bt+pt)+'px';st.width=w+'px';st.height=h+'px';st.font=cs.font;st.letterSpacing=cs.letterSpacing;st.textAlign=cs.textAlign;st.lineHeight=ta?cs.lineHeight:h+'px';sp.className=ta?'ta':'';

 const l=document.querySelector('[data-wt-tx="'+m.id+'"]');if(l){l.value=t.value;grow(l)}const p=document.querySelector('#wt-pv .wtpvt p');if(p){if(t.value)p.textContent=t.value;else p.innerHTML='<span class="mut">Без описания</span>'}wtTicks()});
document.addEventListener('keydown',e=>{const t=e.target;if(S.view!='watch'||!t.dataset||!t.dataset.wtCx)return;if(e.key=='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();e.stopPropagation();t.setRangeText('\n',t.selectionStart,t.selectionEnd,'end');t.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(e.key=='Enter'&&!e.shiftKey||e.key=='Escape'){e.preventDefault();e.stopPropagation();t.blur()}});
document.addEventListener('focusout',e=>{const t=e.target;if(t.classList&&t.classList.contains('wtcx')){t.scrollTop=0;wtMore()}});
document.addEventListener('scroll',e=>{if(e.target.classList&&e.target.classList.contains('wtcx'))wtMore()},true);
document.addEventListener('focusin',e=>{const t=e.target;if(S.view=='watch'&&t.dataset&&t.dataset.wtTx){wtSel(t.dataset.wtTx);if(WS.pv||wtV())wtPreview(t.dataset.wtTx)}});
document.addEventListener('change',e=>{if(S.view=='watch'&&e.target.id=='wt-file'){wtLoad(e.target.files[0]);e.target.value=''}});
document.addEventListener('dragover',e=>{if(S.view=='watch'&&e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();const s=e.target.closest&&e.target.closest('#wt-stage');document.getElementById('wt-stage')&&document.getElementById('wt-stage').classList.toggle('over',!!s)}});
document.addEventListener('dragleave',e=>{if(S.view=='watch'&&!e.relatedTarget){const s=document.getElementById('wt-stage');if(s)s.classList.remove('over')}});
document.addEventListener('drop',e=>{if(S.view!='watch')return;const s=document.getElementById('wt-stage');if(s)s.classList.remove('over');if(!document.getElementById('wtv'))return;e.preventDefault();const f=[...(e.dataTransfer.files||[])][0];if(f)wtLoad(f)});
document.addEventListener('mousemove',e=>{if(S.view!='watch')return;const sk=e.target.closest&&e.target.closest('#wt-seek'),hv=document.getElementById('wt-hv');if(!hv)return;if(!sk){hv.style.display='none';return}const d=wtDur();if(!d){hv.style.display='none';return}const r=sk.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left));hv.style.display='block';hv.style.left=x+'px';hv.textContent=wtFmtF(x/r.width*d)});
document.addEventListener('pointerdown',e=>{const sk=e.target.closest&&e.target.closest('#wt-seek');if(S.view!='watch'||!sk||e.target.closest('.wtk'))return;const v=wtV();if(!v||!isFinite(v.duration))return;e.preventDefault();sk.setPointerCapture&&sk.setPointerCapture(e.pointerId);
 const go=ev=>{const r=sk.getBoundingClientRect();v.currentTime=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*v.duration;wtTick()},up=()=>{sk.classList.remove('drag');sk.removeEventListener('pointermove',go);sk.removeEventListener('pointerup',up)};sk.classList.add('drag');go(e);sk.addEventListener('pointermove',go);sk.addEventListener('pointerup',up)});
document.addEventListener('keydown',e=>{if(S.view!='watch'||!document.getElementById('wtv'))return;const t=e.target;if(/INPUT|TEXTAREA|SELECT/.test(t.tagName)||t.isContentEditable||e.ctrlKey||e.metaKey||e.altKey)return;const v=wtV(),k=e.key;
 if(WS.pv&&!v){if(k=='ArrowLeft'||k=='ArrowRight'){e.preventDefault();wtPvGo(k=='ArrowLeft'?-1:1)}else if(k=='Escape')wtPvClose();return}
 const act=wtKeyAct(e.code);
 if(act=='play'){e.preventDefault();wtToggle()}else if(act=='mark'||act=='shot'){e.preventDefault();wtHot(act=='shot')}else if(act=='fs'){e.preventDefault();wtFsToggle()}else if(k=='ArrowLeft'){e.preventDefault();wtStepGo(-1)}else if(k=='ArrowRight'){e.preventDefault();wtStepGo(1)}
 else if(k==','||k=='.'){wtStepGo(k==','?-1:1,1)}else if(k=='Escape'&&WS.pv){wtPvClose()}
 else if(k=='ArrowUp'||k=='ArrowDown'){e.preventDefault();WS.mute=false;WS.vol=Math.max(0,Math.min(1,WS.vol+(k=='ArrowUp'?.05:-.05)));wtVolApply()}
});
window.addEventListener('pagehide',()=>{try{wtFlush()}catch{}});document.addEventListener('visibilitychange',()=>{if(document.hidden)try{wtFlush()}catch{}});
try{tbRender()}catch{}
